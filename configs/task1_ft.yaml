base_config: configs/base.yaml
task: task1
model_id: Qwen/Qwen3-0.6B
model_revision: main

data:
  dataset_id: meta-math/MetaMathQA
  split: train
  n_examples: 40000
  max_length: 2048
  gsm8k_id: openai/gsm8k
  gsm8k_config: main
  ids_file: ids/task1_train_ids.json

train:
  num_updates: 1250
  micro_batch: 2
  grad_accum: 16
  warmup_updates: 38
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  clip_norm: 1.0
  amp_dtype: float16
  gradient_checkpointing: true
  checkpoint_updates: [312, 625, 937, 1250]
  log_every: 1

methods:
  full:
    kind: full
    lr: 2.0e-5
    l2sp_lambda: 0.0
  l2sp:
    kind: full
    lr: 2.0e-5
    l2sp_lambda: 1.0e-3
  lora4:
    kind: lora
    lr: 2.0e-4
    r: 4
    alpha: 8
    dropout: 0.05
    targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lora16:
    kind: lora
    lr: 2.0e-4
    r: 16
    alpha: 32
    dropout: 0.05
    targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  oplora16:
    kind: oplora
    lr: 2.0e-4
    r: 16
    alpha: 32
    k: 128
    dropout: 0.05
    targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# The seven evaluation conditions: name -> (method, update). update 0 = unchanged model.
conditions:
  baseline: {method: null, update: 0}
  full_625: {method: full, update: 625}
  full_1250: {method: full, update: 1250}
  l2sp_1250: {method: l2sp, update: 1250}
  lora4_1250: {method: lora4, update: 1250}
  lora16_1250: {method: lora16, update: 1250}
  oplora16_1250: {method: oplora16, update: 1250}

eval:
  lm_eval_version: 0.4.8
  dtype: float16
  batch_size: 16          # likelihood tasks
  gen_batch_size: 16      # gsm8k_cot generation
  gsm8k:
    task: gsm8k_cot
    num_fewshot: 0
    max_gen_toks: 1024
    apply_chat_template: true
    enable_thinking: false
    primary_filter: flexible-extract
  likelihood_tasks:
    hellaswag: {metric: acc_norm, raw_metric: acc}
    boolq: {metric: acc, raw_metric: acc}
    arc_easy: {metric: acc_norm, raw_metric: acc}
  merge_check_tol: 1.0e-2     # max |merged - unmerged| logit diff (FP32)

diagnostics:
  layers: [0, 13, 27]
  module: down_proj
  k: 128
  probe_n_gsm8k: 32
  probe_n_hellaswag: 32
  probe_ids_file: ids/task1_probe_ids.json
  conditions: [full_625, full_1250, l2sp_1250, lora4_1250, lora16_1250, oplora16_1250]

qualitative:
  questions_file: data/first_plot_questions.yaml
  max_new_tokens: 512
